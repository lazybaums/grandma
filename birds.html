<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grandma's Bird Window</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        iframe { width: 100vw; height: 100vh; border: none; }
        #glass-floor { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; background: rgba(0,0,0,0); }
        #status {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; font-size: 100px; font-weight: bold; z-index: 10000; 
            pointer-events: none; text-align: center; text-shadow: 4px 4px 10px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>
    <div id="glass-floor"></div>
    <div id="status">No Signal</div>
    <iframe id="bird-stream" src="" allow="autoplay; encrypted-media; fullscreen"></iframe>

    <script>
        // CRITICAL: This is the URL from your "Publish to Web" CSV settings
        const CSV_URL = 'https://google.com';
        let currentUrl = "";

        async function checkUpdate() {
            const statusDiv = document.getElementById('status');
            try {
                const response = await fetch(CSV_URL);
                const text = await response.text();
                const match = text.match(/https?:\/\/[^\s,"]+/);
                const rawUrl = match ? match[0] : null;

                if (rawUrl && rawUrl !== currentUrl) {
                    currentUrl = rawUrl;
                    let videoId = "";
                    
                    if (currentUrl.includes("v=")) {
                        videoId = currentUrl.split("v=")[1].split("&")[0];
                    } else if (currentUrl.includes("youtu.be/")) {
                        videoId = currentUrl.split("youtu.be/")[1].split("?")[0];
                    } else {
                        videoId = currentUrl.split("/").pop().split("?")[0];
                    }

                    document.getElementById('bird-stream').src = `https://youtube.com{videoId}?autoplay=1&mute=0&rel=0`;
                    statusDiv.style.display = "none";
                }
            } catch (e) {
                statusDiv.style.display = "block";
                statusDiv.innerText = "No Signal";
            }
        }

        setInterval(checkUpdate, 30000);
        checkUpdate();
    </script>
</body>
</html>
